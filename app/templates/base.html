{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark"> <!-- Ativa o Dark Mode do Bootstrap -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FUTURE WEAR{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nosso CSS Customizado (Sempre depois do Bootstrap) -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style>
        /* Ajustes finos para o Bootstrap ficar com a cara Yeezy */
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
        }
        .navbar {
            border-bottom: 1px solid #1a1a1a;
            padding: 1.5rem 0;
        }
        .navbar-brand {
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff !important;
        }
        .nav-link {
            color: #888 !important;
            font-size: 11px;
            margin-left: 20px;
        }
        .nav-link:hover {
            color: #fff !important;
        }
        .form-control {
            background-color: transparent !important;
            border: 1px solid #333 !important;
            border-radius: 0 !important;
            color: #fff !important;
            padding: 12px !important;
            font-size: 12px !important;
        }
        .form-control:focus {
            border-color: #fff !important;
            box-shadow: none !important;
        }
        .btn-custom {
            background-color: #fff;
            color: #000;
            border-radius: 0;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #00f0ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">FUTURE//WEAR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#">MALE</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">FEMALE</a></li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item"><span class="nav-link text-white">OLÁ, {{ user.username|upper }}</span></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="{% url 'logout' %}">SAIR</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">LOGIN</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'cadastro' %}">CADASTRO</a></li>
                    {% endif %}
                    
                    <li class="nav-item"><a class="nav-link" href="#">CARRINHO (0)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo das páginas -->
    <div style="margin-top: 100px;">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
