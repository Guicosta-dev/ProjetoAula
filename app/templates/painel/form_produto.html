{% extends 'base.html' %}

{% block title %}{{ titulo }} | FUTURE WEAR{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

            <h1 class="text-center mb-5" style="letter-spacing: 5px; font-weight: 300; font-size: 1.5rem;">
                {{ titulo|upper }}
            </h1>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-4">
                    <label class="form-label d-block mb-2" style="font-size: 10px; color: #666; letter-spacing: 2px;">
                        {{ field.label|upper }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-danger mt-1" style="font-size: 10px;">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-custom mt-2">SALVAR</button>
            </form>

            <p class="text-center mt-4" style="font-size: 10px;">
                <a href="{% url 'painel' %}" style="color: #888;">← VOLTAR AO PAINEL</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
