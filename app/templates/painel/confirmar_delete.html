{% extends 'base.html' %}

{% block title %}Deletar | FUTURE WEAR{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4 text-center">

            <h1 class="mb-4" style="letter-spacing: 5px; font-weight: 300; font-size: 1.5rem;">DELETAR PRODUTO</h1>

            <p class="mb-5">TEM CERTEZA QUE DESEJA DELETAR <strong>{{ produto.nome }}</strong>?</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-custom mb-3" style="background-color: #ff3333; color: #fff;">SIM, DELETAR</button>
            </form>

            <a href="{% url 'painel' %}" style="color: #888;">CANCELAR</a>
        </div>
    </div>
</div>
{% endblock %}
